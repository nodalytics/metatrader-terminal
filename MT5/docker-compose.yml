# MetaTrader 5 is an x86-64 Windows program and Wine has no arm64 build that
# runs one, so this image is amd64 and there is no native ARM alternative to
# build. On an ARM host — Apple Silicon, Graviton — it runs under emulation,
# which works and is slower.
#
# `platform` is pinned so that on ARM Docker pulls the amd64 image and hands it
# to qemu, instead of failing the pull with "no matching manifest". Run
# `./scripts/arm-preflight.sh` first; without binfmt registered the container
# starts and dies with `exec format error`, which says nothing about the cause.
services:
  mt5-terminal:
    image: ghcr.io/nodalytics/mt5-terminal:latest
    platform: linux/amd64
    # Loopback only. Both are reached through something on this host: nginx
    # proxies to localhost:6901 and localhost:8000, and the reverse tunnel and
    # scripts/vnc-tunnel.sh forward to them over SSH. Published on 0.0.0.0 they
    # were open to anyone who could reach the host, and Docker writes its own
    # iptables rules ahead of ufw, so `ufw deny` did not close them.
    ports:
      - "127.0.0.1:6901:6901"
      - "127.0.0.1:8000:8000"
    environment:
      VNC_USER: ${VNC_USER:-"mt5_user"}
      VNC_PASSWORD: ${VNC_PASSWORD:-"password"}
      MT5_LOGIN: ${MT5_LOGIN:-0}
      MT5_API_PORT: ${MT5_API_PORT:-8000}
      API_KEY_SEED: ${API_KEY_SEED:-"default-seed-for-dev"}
      MT5_PASSWORD: ${MT5_PASSWORD:-"password"}
      MT5_SERVER: ${MT5_SERVER:-"MetaTrader-Demo"}
      # How much history the terminal keeps per chart, and so the most
      # `copy_rates_*` can return. The installed default is 100,000, which
      # is what capped the hourly FX series at exactly 99,999 bars. Raising
      # it costs memory in the terminal, which is why the limit below is
      # what it is.
      MT5_MAX_BARS: ${MT5_MAX_BARS:-1000000}
      # Pin the installer to a versioned one here. Empty means the unversioned
      # `mt5setup.exe`, which is whatever MetaQuotes ships today - and the
      # Python package is pinned at MetaTrader5==5.0.5640, so a terminal build
      # the package cannot talk to takes the desk's broker away with it. Build
      # 6140 is known good and 6204 is known bad; 6230 is serving now. Empty is
      # the default because a URL that 404s stops the terminal installing at
      # all, which is worse - but pin it before any deliberate reinstall.
      MT5_SETUP_URL: ${MT5_SETUP_URL:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      # **The Wine prefix must outlive the container**, and until 2026-10-02 it
      # did not. It holds terminal64.exe and `Config/common.ini`, and nothing
      # but the container's own writable layer held them - so every
      # `up --force-recreate` or image change silently reinstalled MetaTrader
      # from scratch.
      #
      # **It was not, however, what caused the 2026-09-29 outage**, and an earlier
      # version of this comment said it was. The container was created on
      # 2026-09-20 and only restarted on 10-02, while terminal64.exe was
      # rewritten in place on 09-29 at 04:32 at a size matching neither image
      # this repository builds. MetaTrader updated *itself*, reset the Experts
      # switch doing it, and the last trade closed at 04:35 - three minutes
      # later. Every order after that was refused with "AutoTrading disabled by
      # client" until the toggle was pressed by hand on 10-02 at 06:53. Three
      # days of a desk that decided correctly and could not act, and no recreate
      # anywhere near it.
      #
      # So this volume is insurance against a different failure than the one
      # that happened. It is still worth having - a recreate does destroy the
      # prefix, and both images bake a terminal in, so the one a recreate comes
      # up on is the image's build rather than whatever the running one had
      # updated itself to. The defence against the self-update is
      # `ensure_algo_ini.py` and `toggle_algo.py`, not this.
      #
      # `ensure_algo_ini.py` now reasserts the switch before each launch, which
      # closes that specific hole. This closes the class: a recreate stops being
      # an MT5 reinstall. The login survives either way - it comes from
      # MT5_LOGIN/MT5_PASSWORD/MT5_SERVER above, not from the prefix - so what
      # was being lost was the install, the charts and the switch, not access.
      #
      # **The first `up` does not install, and an earlier version of this said it
      # would.** Docker populates an empty named volume from whatever the image
      # holds at the mount point, and this image bakes a whole 2.3GB prefix -
      # wine's registry, the wine-python site-packages the API imports, and a
      # terminal64.exe. So a fresh volume comes up on the *image's* terminal
      # and `run-mt5.sh` takes its "already installed" branch.
      #
      # Which is the part worth knowing before trusting this: a fresh volume
      # silently changes **which build runs**, from whatever the live terminal
      # had updated itself to back to whatever the image was built against. That
      # is a downgrade of unknown size, and build 6204 is on record breaking the
      # Python binding's IPC while 6140 was fine. To keep a known-good terminal
      # across a move to this volume, seed it from the running prefix first and
      # let the image supply only the wine runtime.
      - mt5-wineprefix:/opt/wineprefix
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.8'
          # 4G, not 1G. The terminal caches `MT5_MAX_BARS` bars per chart and a
          # deep history request marshals every bar through Python, so 1G is not
          # enough to serve one: a request for 100,000 hourly bars failed inside
          # the terminal and came back as a 404. The running deployment was
          # already raised to 4G by hand; this is the file catching up with it.
          memory: 4G
        reservations:
          memory: 512M

volumes:
  # Named rather than a bind mount: the prefix is written by root inside the
  # container, and a host directory would come out owned by root on the host
  # and need chowning by hand on every machine this runs on.
  mt5-wineprefix:
