# Two suites, two environments, and not by preference: the bridge's FastAPI
# application pins `pydantic<2.0.0` while the MCP SDK requires pydantic 2, so
# `tests/contract` and `tests/registry` cannot run in the same interpreter.
# `conftest.py` collects whichever one this interpreter is equipped for, and
# says in the header which it left out. See README.md.
#
# No `-q` in addopts: it suppresses the header, which is where that reason is
# printed, and an empty run with no explanation is the confusing case this is
# all meant to avoid.
[pytest]
pythonpath = .
testpaths = tests
