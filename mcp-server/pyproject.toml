# `uv_build`, matching `nautilus-mt5`. Two backends in one workspace is two
# sets of packaging behaviour to remember for no gain; the wheel this produces
# is the same one setuptools produced from the same `mt5_mcp/` tree.
[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

# The package directory sits beside this file rather than under a `src/`, which
# is the layout that already exists here. `module-name` is stated because
# `uv_build` otherwise derives it from the project name and looks for
# `mt5_mcp_server/`: the distribution is `mt5-mcp-server` and the import is
# `mt5_mcp`, which is also what `[project.scripts]` below points at.
[tool.uv.build-backend]
module-root = ""
module-name = "mt5_mcp"

[project]
name = "mt5-mcp-server"
version = "0.1.0"
description = "An MCP server over the MetaTrader 5 HTTP bridge in this repository"
readme = "README.md"
# 3.10 and not 3.9: the tool signatures use `X | None` as a runtime
# expression. They cannot be strings instead - the MCP SDK calls `issubclass`
# on each parameter's annotation while building a tool's input schema, so
# `from __future__ import annotations` in the tool module makes every tool
# unregisterable.
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/nodalytics/metatrader-terminal"

[project.scripts]
mt5-mcp = "mt5_mcp.server:main"
