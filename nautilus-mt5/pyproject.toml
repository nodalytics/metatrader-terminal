[project]
name = "nautilus-mt5"
version = "0.1.0"
description = "A NautilusTrader adapter for MetaTrader 5, over the metatrader-terminal HTTP bridge."
# **3.12, and not by preference.** `nautilus_trader` 1.221's
# `BacktestEngine.run()` aborts with `double free or corruption (out)` and exit
# 134 on one bar, no strategy and without importing this package at all -
# reproduced on two hosts with different glibc versions, so it is the release
# and not a machine. Every line that fixes it requires Python >= 3.12 and 1.221
# was the last with a cp311 wheel, so the pin and the interpreter had to move
# together.
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # 1.231 or later for the reason above. The docs still describe an API
    # rename that has not shipped - they call `LiveMarketDataClient`,
    # `LiveExecutionClient` and `TradingNode` by the v1 names
    # `MarketDataClient`, `ExecutionClient` and `LiveNode` - so this is written
    # against what is released rather than what is documented.
    "nautilus_trader>=1.231,<1.240",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Talking to the terminal by proxying the `MetaTrader5` module itself out of a
# Wine prefix, instead of over HTTP. Lower latency and the whole MT5 surface,
# at the cost of the bridge's isolation - see `transport.py`.
rpyc = ["rpyc>=6.0.0"]
# Letting the node start the terminal container itself, the way the
# Interactive Brokers adapter starts TWS. Optional because the usual
# arrangement is a terminal somebody else's deploy already runs.
docker = ["docker>=7.1.0"]

[project.urls]
Homepage = "https://github.com/nodalytics/metatrader-terminal"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
