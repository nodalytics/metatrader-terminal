# Pull the published image onto the box and restart it.
#
# This file used to be commented out from the first line to the last. GitHub
# still parses it, finds no `on:` and no `jobs:`, and fails the run — so every
# push showed a red Deploy that was not a deploy failing but a file that could
# not be read. Being valid is the fix; what it does when run is below.
name: Remote SSH Deploy

# **Manual on purpose.** The commented version triggered on every successful
# build of `main`, but it had never run, so switching it on here would have
# turned "make the file valid" into "start deploying to production on every
# merge" — a much larger change than the one being asked for.
#
# To make it automatic, replace `workflow_dispatch` with:
#
#   workflow_run:
#     workflows: ["Docker Build & Test"]
#     types: [completed]
#     branches: [main]
#
# and gate the job on `github.event.workflow_run.conclusion == 'success'`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy"
        required: false
        default: "latest"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the terminal host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Staging, not the live directory ──────────────────────────────
      # These files used to land straight on `DEPLOY_PATH`. That is only the
      # right place if the service actually runs from there, and on
      # 2026-11-05 it did not: the first successful run of this workflow
      # copied a compose file into a directory the running stack had never
      # used, found no `.env` beside it, wrote one from the template, and
      # brought the bridge up on placeholder credentials. The desk then saw
      # 4,350 `401 Invalid or missing API Key` a minute and could neither
      # read bars nor place an order.
      #
      # So the files go to a staging directory and the step below copies them
      # into whichever directory Docker says the stack is running from.
      - name: Stage deployment files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "MT5/docker-compose.yml,MT5/.env.example,nginx/"
          target: "~/.mt5-deploy-staging"
          strip_components: 1

      - name: Deploy services and update server config
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ github.event.inputs.tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: TAG
          script: |
            set -euo pipefail

            # ── Deploy where the service runs ─────────────────────────────
            # Docker knows where the stack was brought up from; `DEPLOY_PATH`
            # only records where somebody once intended it to be. When the two
            # disagree, the compose file is the one to believe — deploying to
            # the other directory is how this workflow brought the bridge up
            # on template credentials the first time it ever succeeded.
            # The compose working directory is a label on the running
            # container, so this is what Docker itself believes rather than a
            # path parsed back out of a config file.
            HERE="$(docker ps \
              --format '{{.Image}}|{{.Label "com.docker.compose.project.working_dir"}}' \
              | grep -i 'mt5-terminal' | head -1 | cut -d'|' -f2 || true)"
            if [ -z "$HERE" ]; then
              HERE="${{ secrets.DEPLOY_PATH }}"
              echo "no running mt5 stack found; using DEPLOY_PATH"
            else
              echo "the mt5 stack runs from $HERE"
            fi
            cd "$HERE"

            cp -f ~/.mt5-deploy-staging/docker-compose.yml .
            cp -f ~/.mt5-deploy-staging/.env.example .
            if [ -d ~/.mt5-deploy-staging/nginx ]; then
              cp -rf ~/.mt5-deploy-staging/nginx .
            fi

            # ── Environment: never invented ───────────────────────────────
            # An earlier version copied the template over the live file on
            # every deploy. The fix was "only when absent", and absent turned
            # out to be the dangerous case: a missing `.env` means this is not
            # the configured directory, or the configuration was lost, and
            # either way the answer is to stop rather than to make one up.
            # Placeholder credentials produce a container that starts, answers
            # its health check, and cannot log in or authenticate a caller —
            # a deploy that reports success over a desk that cannot trade.
            #
            # A `.env` byte-identical to the template is the same thing with
            # extra steps, so it is removed rather than trusted.
            if [ -f .env ] && cmp -s .env .env.example; then
              echo "::warning::.env is byte-identical to the template, so it is"
              echo "::warning::not configuration. Removing it."
              rm -f .env
            fi
            if [ ! -f .env ]; then
              echo "::error::no .env in $HERE. Refusing to invent one: a"
              echo "::error::deploy on placeholder credentials starts a bridge"
              echo "::error::that passes its health check and cannot trade."
              echo "::error::Restore MT5_LOGIN, MT5_PASSWORD, MT5_SERVER and"
              echo "::error::API_KEY_SEED (which must match the desk's), then"
              echo "::error::re-run this workflow."
              # Paths only, never contents. The usual cause is that the stack
              # was brought up from somewhere other than this directory, in
              # which case its real environment file is still on this host and
              # the operator needs to know where - which is the one question
              # the previous version answered by inventing an answer.
              echo "environment files on this host, newest first:"
              find "$HOME" -maxdepth 4 -name '.env' -printf '%TY-%Tm-%Td %TH:%TM  %p\n' \
                2>/dev/null | sort -r | head -10 || true
              exit 1
            fi
            echo ".env present; left alone"

            # ── Pull and restart ──────────────────────────────────────────
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker logout ghcr.io

            # ── Cleanup ───────────────────────────────────────────────────
            # `--volumes` is deliberately absent. `docker system prune -af
            # --volumes` removes every volume not currently attached to a
            # running container, which on a box mid-restart is a good way to
            # delete the terminal's own state along with the rubbish.
            echo "Pruning unused images and build cache..."
            docker image prune -af
            docker builder prune -f --filter "until=48h"

      - name: Prove it came back up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            # The compose working directory is a label on the running
            # container, so this is what Docker itself believes rather than a
            # path parsed back out of a config file.
            HERE="$(docker ps \
              --format '{{.Image}}|{{.Label "com.docker.compose.project.working_dir"}}' \
              | grep -i 'mt5-terminal' | head -1 | cut -d'|' -f2 || true)"
            cd "${HERE:-${{ secrets.DEPLOY_PATH }}}"

            # ── Running is not the same as serving ────────────────────────
            # `sleep 20` then one check was wrong twice over. MetaTrader runs
            # under Wine and has to start a desktop session, install or load a
            # 2.3GB prefix and log in to the broker; twenty seconds is not
            # enough, so the check raced the thing it was checking. And a
            # container that is *running* while its API is dead is the failure
            # that matters here - the repository records three days of "a desk
            # that decided correctly and could not act". So poll the API, with
            # a bound, and print the logs on the way out.
            # **600, not 300.** MetaTrader starts under Wine, loads or
            # installs its prefix and logs in to the broker; on 2026-11-05 a
            # cold start after a full image pull answered at 09:49:05 and the
            # check had given up at 09:49:10 - five seconds short, reported as
            # a deploy failure over a deploy that worked. The image is now
            # 4.36GB rather than 9.41GB so the pull is quicker, but the margin
            # was the problem, not the mean.
            deadline=$(( $(date +%s) + 600 ))
            until curl -sf --max-time 5 -o /dev/null http://127.0.0.1:8000/; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::the bridge did not answer on 127.0.0.1:8000 within 600s"
                docker compose ps
                docker compose logs --tail 80
                exit 1
              fi
              sleep 5
            done
            echo "✅ the bridge answers on 127.0.0.1:8000"

            # ── The desk reaches the bridge only through the tunnel ───────
            # Loopback answering proves nothing about whether the trading box
            # can see it: the port on that box is held open from here by a
            # reverse SSH tunnel. Restarting the container does not restart
            # the tunnel, so a deploy could leave a healthy terminal that the
            # desk cannot reach - which looks like a broker outage, not a
            # deploy problem. Checked, and nudged if the unit exists.
            if systemctl list-unit-files mt5-tunnel.service >/dev/null 2>&1 \
               && systemctl cat mt5-tunnel.service >/dev/null 2>&1; then
              sudo systemctl restart mt5-tunnel.service || true
              sleep 3
              if systemctl is-active --quiet mt5-tunnel.service; then
                echo "✅ mt5-tunnel.service is active"
              else
                echo "::warning::mt5-tunnel.service is not active - the desk cannot reach this bridge"
                systemctl --no-pager status mt5-tunnel.service | head -15 || true
              fi
            else
              echo "::warning::mt5-tunnel.service is not installed; run scripts/install-tunnel.sh"
            fi
