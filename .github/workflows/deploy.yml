# Pull the published image onto the box and restart it.
#
# This file used to be commented out from the first line to the last. GitHub
# still parses it, finds no `on:` and no `jobs:`, and fails the run — so every
# push showed a red Deploy that was not a deploy failing but a file that could
# not be read. Being valid is the fix; what it does when run is below.
name: Remote SSH Deploy

# **Manual on purpose.** The commented version triggered on every successful
# build of `main`, but it had never run, so switching it on here would have
# turned "make the file valid" into "start deploying to production on every
# merge" — a much larger change than the one being asked for.
#
# To make it automatic, replace `workflow_dispatch` with:
#
#   workflow_run:
#     workflows: ["Docker Build & Test"]
#     types: [completed]
#     branches: [main]
#
# and gate the job on `github.event.workflow_run.conclusion == 'success'`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy"
        required: false
        default: "latest"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the terminal host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "MT5/docker-compose.yml,MT5/.env.example,nginx/"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy services and update server config
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ github.event.inputs.tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: TAG
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            # ── Environment ───────────────────────────────────────────────
            # Seeded only when absent. The previous version ran
            # `cp .env.example .env` unconditionally, which on every deploy
            # would have overwritten the live file — MT5 login, password,
            # server and API_KEY_SEED — with the template's placeholders. The
            # container would then come up and fail to log in, and the cause
            # would be a deploy that reported success.
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "seeded .env from the template — it needs real credentials"
            else
              echo ".env exists; left alone"
            fi

            # ── Pull and restart ──────────────────────────────────────────
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker logout ghcr.io

            # ── Cleanup ───────────────────────────────────────────────────
            # `--volumes` is deliberately absent. `docker system prune -af
            # --volumes` removes every volume not currently attached to a
            # running container, which on a box mid-restart is a good way to
            # delete the terminal's own state along with the rubbish.
            echo "Pruning unused images and build cache..."
            docker image prune -af
            docker builder prune -f --filter "until=48h"

      - name: Prove it came back up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            # ── Running is not the same as serving ────────────────────────
            # `sleep 20` then one check was wrong twice over. MetaTrader runs
            # under Wine and has to start a desktop session, install or load a
            # 2.3GB prefix and log in to the broker; twenty seconds is not
            # enough, so the check raced the thing it was checking. And a
            # container that is *running* while its API is dead is the failure
            # that matters here - the repository records three days of "a desk
            # that decided correctly and could not act". So poll the API, with
            # a bound, and print the logs on the way out.
            deadline=$(( $(date +%s) + 300 ))
            until curl -sf --max-time 5 -o /dev/null http://127.0.0.1:8000/; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::the bridge did not answer on 127.0.0.1:8000 within 300s"
                docker compose ps
                docker compose logs --tail 80
                exit 1
              fi
              sleep 5
            done
            echo "✅ the bridge answers on 127.0.0.1:8000"

            # ── The desk reaches the bridge only through the tunnel ───────
            # Loopback answering proves nothing about whether the trading box
            # can see it: the port on that box is held open from here by a
            # reverse SSH tunnel. Restarting the container does not restart
            # the tunnel, so a deploy could leave a healthy terminal that the
            # desk cannot reach - which looks like a broker outage, not a
            # deploy problem. Checked, and nudged if the unit exists.
            if systemctl list-unit-files mt5-tunnel.service >/dev/null 2>&1 \
               && systemctl cat mt5-tunnel.service >/dev/null 2>&1; then
              sudo systemctl restart mt5-tunnel.service || true
              sleep 3
              if systemctl is-active --quiet mt5-tunnel.service; then
                echo "✅ mt5-tunnel.service is active"
              else
                echo "::warning::mt5-tunnel.service is not active - the desk cannot reach this bridge"
                systemctl --no-pager status mt5-tunnel.service | head -15 || true
              fi
            else
              echo "::warning::mt5-tunnel.service is not installed; run scripts/install-tunnel.sh"
            fi
